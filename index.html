    <script>
      // Suppress harmless Vite HMR WebSocket connection closed warnings in dev container
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e.reason || '';
        var msg = typeof reason === 'string' ? reason : (reason.message || '');
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(e) {
        var msg = e.message || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
